<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users — BizLink</title>
  <link rel="stylesheet" href="../assets/styles.css">
</head>
<body>
<header class="top">
  <a class="wordmark" href="../index.html">Biz<em>Link</em></a>
  <div class="top-links">
    <a href="../index.html">Home</a>
    <a href="users.html" class="current">All users</a>
    <a href="profile.html">Profile</a>
  </div>
  <div class="auth-actions">
    <a class="auth-link" href="login.html">Sign in</a>
    <a class="auth-cta" href="register.html">Register</a>
  </div>
</header>

<main style="max-width:960px;margin:0 auto;padding:32px 20px 80px;">
  <div class="panel-head" style="margin-bottom:8px;">
    <div>
      <h1 style="font-size:28px;">Users</h1>
      <p style="color:var(--muted);margin:0;">Simulated directory — Create via register, Read here, Update below. No delete.</p>
    </div>
    <a class="btn-primary" href="register.html">Create user</a>
  </div>

  <div class="banner success" style="margin-bottom:20px;">
    <span><b>Demo logins</b> (password <code>demo1234</code>): thandi@spaza.demo · kabelo@driver.demo · nomsa@customer.demo</span>
  </div>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Phone</th>
        <th>Area</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="user-rows"></tbody>
  </table>

  <div class="job-card" id="edit-panel" style="display:none;margin-top:28px;">
    <h2 style="font-size:18px;margin-bottom:12px;">Update user</h2>
    <form id="edit-form">
      <input type="hidden" id="edit-id">
      <div class="form-row">
        <div class="form-field">
          <label for="edit-name">Name</label>
          <input id="edit-name" required>
        </div>
        <div class="form-field">
          <label for="edit-phone">Phone</label>
          <input id="edit-phone" type="tel">
        </div>
      </div>
      <div class="form-row">
        <div class="form-field">
          <label for="edit-role">Role</label>
          <select id="edit-role">
            <option value="CUSTOMER">Customer</option>
            <option value="BUSINESS">Business</option>
            <option value="DRIVER">Driver</option>
          </select>
        </div>
        <div class="form-field">
          <label for="edit-area">Area</label>
          <input id="edit-area">
        </div>
      </div>
      <div class="form-field" id="edit-biz-wrap" hidden>
        <label for="edit-biz">Business name</label>
        <input id="edit-biz">
      </div>
      <p id="edit-msg" style="font-size:13px;min-height:18px;margin:0 0 12px;"></p>
      <div class="cta-row">
        <button class="btn-primary" type="submit">Save update</button>
        <button class="btn-ghost" type="button" id="edit-cancel">Cancel</button>
      </div>
    </form>
  </div>
</main>

<script src="../assets/users.js"></script>
<script>
  function rolePill(role) {
    var cls = role === 'DRIVER' ? 'collecting' : role === 'BUSINESS' ? 'waiting' : 'delivered';
    return '<span class="status-pill ' + cls + '">' + role + '</span>';
  }

  function render() {
    var rows = document.getElementById('user-rows');
    var users = BizLinkUsers.list();
    if (!users.length) {
      rows.innerHTML = '<tr><td colspan="6" style="color:var(--muted);">No users yet. Register to create one.</td></tr>';
      return;
    }
    rows.innerHTML = users.map(function (u) {
      return '<tr>' +
        '<td><b>' + escapeHtml(u.name) + '</b>' +
          (u.businessName ? '<div style="font-size:12px;color:var(--muted);">' + escapeHtml(u.businessName) + '</div>' : '') +
        '</td>' +
        '<td>' + escapeHtml(u.email) + '</td>' +
        '<td>' + rolePill(u.role) + '</td>' +
        '<td>' + escapeHtml(u.phone || '—') + '</td>' +
        '<td>' + escapeHtml(u.area || '—') + '</td>' +
        '<td><button type="button" class="btn-ghost" style="padding:6px 12px;font-size:12px;" data-edit="' + u.id + '">Edit</button></td>' +
      '</tr>';
    }).join('');

    rows.querySelectorAll('[data-edit]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        openEdit(btn.getAttribute('data-edit'));
      });
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function openEdit(id) {
    var u = BizLinkUsers.getById(id);
    if (!u) return;
    document.getElementById('edit-panel').style.display = 'block';
    document.getElementById('edit-id').value = u.id;
    document.getElementById('edit-name').value = u.name;
    document.getElementById('edit-phone').value = u.phone || '';
    document.getElementById('edit-role').value = u.role;
    document.getElementById('edit-area').value = u.area || '';
    document.getElementById('edit-biz').value = u.businessName || '';
    document.getElementById('edit-biz-wrap').hidden = u.role !== 'BUSINESS';
    document.getElementById('edit-msg').textContent = '';
    document.getElementById('edit-panel').scrollIntoView({ behavior: 'smooth' });
  }

  document.getElementById('edit-role').addEventListener('change', function () {
    document.getElementById('edit-biz-wrap').hidden = this.value !== 'BUSINESS';
  });

  document.getElementById('edit-cancel').addEventListener('click', function () {
    document.getElementById('edit-panel').style.display = 'none';
  });

  document.getElementById('edit-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var id = document.getElementById('edit-id').value;
    var msg = document.getElementById('edit-msg');
    var result = BizLinkUsers.update(id, {
      name: document.getElementById('edit-name').value,
      phone: document.getElementById('edit-phone').value,
      role: document.getElementById('edit-role').value,
      area: document.getElementById('edit-area').value,
      businessName: document.getElementById('edit-biz').value
    });
    if (!result.ok) {
      msg.style.color = 'var(--red)';
      msg.textContent = result.error;
      return;
    }
    msg.style.color = 'var(--success)';
    msg.textContent = 'Updated ' + result.user.name + '.';
    render();
  });

  render();
</script>
</body>
</html>
