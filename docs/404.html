<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BizLink — Page not found</title>
  <style>
    :root{--blue:#1769e0;--yellow:#f4c542;--ink:#10233f}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f8fc;color:var(--ink);font-family:Inter,system-ui,sans-serif}
    main{max-width:560px;padding:44px;background:#fff;border:1px solid #dbe4f0;border-radius:24px;text-align:center;box-shadow:0 20px 60px rgba(16,35,63,.12)}
    .logo{font-weight:850;font-size:28px}.logo em{color:var(--blue);font-style:normal}
    .code{display:inline-block;margin:28px 0 8px;padding:8px 14px;border-radius:999px;background:#fff4c7;color:#7a5a00;font-weight:800}
    h1{font-size:42px;margin:10px 0}.muted{color:#60708a;line-height:1.6}
    a{display:inline-block;margin-top:18px;padding:12px 18px;border-radius:12px;background:var(--blue);color:#fff;text-decoration:none;font-weight:750}
  </style>
</head>
<body>
<main>
  <div class="logo">Biz<em>Link</em></div>
  <div class="code">404</div>
  <h1>Page not found</h1>
  <p class="muted">That BizLink page does not exist. Use the home page to continue.</p>
  <a href="./index.html">Back to BizLink</a>
</main>
</body>
</html>
