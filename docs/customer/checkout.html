<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checkout — BizLink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css">
</head>
<body>
<header class="top">
  <a class="wordmark" href="../index.html">Biz<em>Link</em></a>
  <nav class="top-links" aria-label="Customer">
    <a href="index.html">Shop</a>
    <a href="checkout.html" class="current">Checkout</a>
    <a href="track.html">Track</a>
    <a href="orders.html">Orders</a>
    <a href="../auth/profile.html">Profile</a>
  </nav>
</header>

<main>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="biz-name" data-bizlink-user>Customer</div>
      <div class="biz-loc">Soshanguve South</div>
      <nav aria-label="Customer sections">
        <a href="index.html">Shop</a>
        <a href="checkout.html" class="current">Checkout</a>
        <a href="track.html">Track</a>
        <a href="orders.html">Orders</a>
        <a href="../auth/profile.html">Profile</a>
      </nav>
    </aside>
    <div class="panel">
      <div class="panel-head">
        <div>
          <h2>Checkout</h2>
          <div class="sub">Arrival estimated from distance and speed</div>
        </div>
      </div>

      <div style="max-width:420px;">
        <div class="form-field">
          <label for="shop">Shop</label>
          <select id="shop">
            <option value="Thandi's Spaza|0.4">Thandi's Spaza · 0.4 km</option>
            <option value="Mzansi Kota Corner|0.5">Mzansi Kota Corner · 0.5 km</option>
            <option value="Nomvula's Fashions|1.1">Nomvula's Fashions · 1.1 km</option>
            <option value="Boxer Corner Hardware|0.9">Boxer Corner Hardware · 0.9 km</option>
          </select>
        </div>

        <div class="form-field">
          <label for="addr">Where should we deliver?</label>
          <input id="addr" type="text" placeholder="e.g. Next to Boxer, near the big tree" value="Block F, blue roof, near the tuckshop">
        </div>
        <div class="form-field">
          <label for="phone">Phone (for driver)</label>
          <input id="phone" type="tel" placeholder="06x xxx xxxx" value="082 555 0199">
        </div>
        <div class="form-field">
          <label for="slot">Preferred window (optional)</label>
          <select id="slot">
            <option value="">ASAP — best ETA</option>
            <option>Within 30 min</option>
            <option>Within 1 hour</option>
            <option>Today 14:00 – 16:00</option>
            <option>Today 16:00 – 18:00</option>
          </select>
        </div>

        <div class="job-card" style="margin-bottom:16px;background:var(--blue-tint);border-color:rgba(23,105,224,.2);">
          <div style="font-size:12px;font-weight:600;color:var(--blue);text-transform:uppercase;">Estimated arrival</div>
          <div style="font-size:28px;font-weight:600;margin-top:4px;" id="preview-eta">—</div>
          <div style="font-size:13px;color:var(--muted);" id="preview-detail">Distance ÷ speed + prep</div>
        </div>

        <div class="stat" style="margin-bottom:20px;">
          <div class="label">Order total</div>
          <div class="num" id="pay-total">R 0</div>
          <div class="label" style="margin-top:6px;">+ delivery fee (~R 12–18)</div>
        </div>

        <div class="cta-row">
          <button class="btn-primary" type="button" onclick="placeOrder()" style="width:auto;">Place order &amp; track</button>
          <a class="btn-ghost" href="index.html">Back to shops</a>
        </div>
      </div>
    </div>
  </div>
</main>
<script src="../assets/store.js"></script>
<script src="../assets/flow.js"></script>
<script>
  var total = parseInt(sessionStorage.getItem('bizlink_cart_total') || '0', 10);
  document.getElementById('pay-total').textContent = 'R ' + total;

  var SPEED = 28;
  function travelMins(km) {
    return Math.max(1, Math.round((km / SPEED) * 60));
  }
  function preview() {
    var parts = document.getElementById('shop').value.split('|');
    var km = parseFloat(parts[1]) || 1;
    var mins = 6 + 2 + travelMins(2.4) + travelMins(km);
    var d = new Date(Date.now() + mins * 60000);
    var clock = (d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes();
    document.getElementById('preview-eta').textContent = '~' + mins + ' min · by ' + clock;
    document.getElementById('preview-detail').textContent =
      km.toFixed(1) + ' km · ~' + SPEED + ' km/h · prep + match included';
  }
  document.getElementById('shop').addEventListener('change', preview);
  preview();

  function placeOrder(){
    if(total <= 0){ alert('Add items from the shop first.'); return; }
    var parts = document.getElementById('shop').value.split('|');
    var order = {
      total: total,
      addr: document.getElementById('addr').value,
      phone: document.getElementById('phone').value,
      scheduleSlot: document.getElementById('slot').value,
      shopName: parts[0],
      distanceKm: parseFloat(parts[1]) || 1.2,
      status: 'placed',
      placedAt: Date.now(),
      itemsNote: 'Marketplace basket'
    };
    sessionStorage.setItem('bizlink_customer_order', JSON.stringify(order));
    BizLinkStore.addCustomerOrder(order);
    if (order.scheduleSlot) {
      BizLinkStore.addSchedule({
        type: 'customer',
        date: new Date().toISOString().slice(0, 10),
        slot: order.scheduleSlot,
        note: order.addr,
        status: 'scheduled'
      });
    }
    sessionStorage.setItem('bizlink_cart_total', '0');
    window.location.href = 'track.html';
  }
</script>
</body>
</html>
