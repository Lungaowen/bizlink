<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My orders — BizLink Customer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css">
</head>
<body>
<header class="top">
  <a class="wordmark" href="../index.html">Biz<em>Link</em></a>
  <div class="top-links">
    <a href="../index.html">Home</a>
    <a href="index.html" class="current">Customer</a>
  </div>
</header>

<main>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="biz-name" data-bizlink-user>Customer</div>
      <div class="biz-loc">Soshanguve South</div>
      <nav>
        <a href="index.html">Shop</a>
        <a href="checkout.html">Checkout</a>
        <a href="track.html">Track order</a>
        <a href="orders.html" class="current">My orders</a>
        <a href="../auth/profile.html">Profile</a>
      </nav>
    </aside>
    <div class="panel">
      <div class="panel-head">
        <div>
          <h2>Historic orders</h2>
          <div class="sub">Orders you placed via BizLink in this browser</div>
        </div>
        <a class="btn-primary" href="index.html" style="width:auto;">Order again</a>
      </div>

      <table>
        <thead><tr><th>When</th><th>Total</th><th>Address</th><th>Slot</th><th>Status</th><th></th></tr></thead>
        <tbody id="hist-rows"></tbody>
      </table>
    </div>
  </div>
</main>
<script src="../assets/store.js"></script>
<script src="../assets/flow.js"></script>
<script>
  var list = BizLinkStore.listCustomerOrders();
  var rows = document.getElementById('hist-rows');
  if (!list.length) {
    rows.innerHTML = '<tr><td colspan="6" style="color:var(--muted);padding:24px 10px;">No orders yet. <a href="index.html" style="color:var(--blue);font-weight:600;">Browse shops</a> and checkout to build history.</td></tr>';
  } else {
    rows.innerHTML = list.map(function (o) {
      var when = o.placedAt ? new Date(o.placedAt).toLocaleString() : '—';
      var pill = o.status === 'delivered' ? 'delivered' : (o.status === 'finding_driver' || o.status === 'placed' ? 'waiting' : 'collecting');
      return '<tr>' +
        '<td>' + when + '</td>' +
        '<td><b>R ' + o.total + '</b></td>' +
        '<td>' + (o.addr || '—') + '</td>' +
        '<td>' + (o.scheduleSlot || 'ASAP') + '</td>' +
        '<td><span class="status-pill ' + pill + '">' + (o.status || 'placed') + '</span></td>' +
        '<td><a class="btn-ghost" style="padding:8px 12px;font-size:12px;" href="track.html">Track</a></td>' +
      '</tr>';
    }).join('');
  }
</script>
</body>
</html>
